<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viernes Showdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/weekend.css}">
</head>
<body>
<div class="bg-glow"></div>
<main class="layout">
    <section class="hero">
        <p class="eyebrow">Planificador absurdo-serio</p>
        <h1>Que hacer este fin de semana sin pensar demasiado</h1>
        <p class="headline" th:text="${headline}">Es viernes: productividad minima, diversion maxima</p>
    </section>

    <section class="grid">
        <article class="card" th:each="plan, stat : ${plans}" th:style="'--delay:' + ${stat.index} * 80 + 'ms'">
            <h2 th:text="${plan.title}">Modo chef ninja</h2>
            <p class="vibe" th:text="${plan.vibe}">Cocinar algo extravagante con musica de pelicula</p>
            <ul>
                <li><strong>Presupuesto:</strong> <span th:text="${plan.budget}">15-25 EUR</span></li>
                <li><strong>Bateria social:</strong> <span th:text="${plan.socialBattery}">Media</span></li>
            </ul>
            <p class="punchline" th:text="${plan.punchline}">Si se quema, se llama sabor ahumado artesanal</p>
        </article>
    </section>
</main>
</body>
</html>
